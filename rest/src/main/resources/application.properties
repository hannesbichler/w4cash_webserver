server.port=3000
server.address=0.0.0.0

# The JPA mirror tables live in in-memory H2 (see DataSourceConfig#jpaDataSource).
# Pinned explicitly: Boot inferred create-drop from the auto-configured embedded
# datasource, which is no longer what supplies H2.
spring.jpa.hibernate.ddl-auto=create-drop

# Oracle connection pool (see DataSourceConfig#w4cashDataSource).
w4cash.datasource.pool-size=10
w4cash.datasource.connection-timeout-ms=10000
